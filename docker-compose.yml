services:
  doc-photo-qa:
    build: .
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./logs:/srv/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f'http://localhost:{os.environ.get(\"PORT\", 5000)}/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
